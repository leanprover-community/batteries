name: Test Mathlib

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: mathlib-adaptation-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.repository == 'leanprover-community/batteries'
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.plan.outputs.pr_number }}
      batteries_sha: ${{ steps.plan.outputs.batteries_sha }}
      batteries_repo: ${{ steps.plan.outputs.batteries_repo }}
      mathlib_sha: ${{ steps.plan.outputs.mathlib_sha }}
      adaptation_fork: ${{ steps.plan.outputs.adaptation_fork }}
      adaptation_pr: ${{ steps.plan.outputs.adaptation_pr }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ADAPTATION_FORK: ${{ vars.MATHLIB_ADAPTATION_FORK }}
        with:
          script: |
            const helpers = require('./.github/scripts/mathlib_adaptations.js');
            await helpers.plan({ github, context, core });

  check:
    needs: plan
    if: needs.plan.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      build_result: ${{ steps.wait.outputs.build_result }}
      downstream_run: ${{ steps.wait.outputs.downstream_run }}
      downstream_url: ${{ steps.wait.outputs.downstream_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Dispatch and wait for downstream validation
        id: wait
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP_ID: ${{ secrets.MATHLIB_NIGHTLY_TESTING_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.MATHLIB_NIGHTLY_TESTING_PRIVATE_KEY }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          BATTERIES_SHA: ${{ needs.plan.outputs.batteries_sha }}
          BATTERIES_REPO: ${{ needs.plan.outputs.batteries_repo }}
          MATHLIB_SHA: ${{ needs.plan.outputs.mathlib_sha }}
          ADAPTATION_FORK: ${{ needs.plan.outputs.adaptation_fork }}
          ADAPTATION_PR: ${{ needs.plan.outputs.adaptation_pr }}
        with:
          script: |
            const helpers = require('./.github/scripts/dispatch_mathlib.js');
            await helpers.dispatchAndWait({ github, context, core });

  publish:
    needs: [plan, check]
    if: needs.check.outputs.build_result == 'failure' || needs.plan.outputs.adaptation_pr != ''
    # Use a fresh runner. Never execute the candidate tree with write tokens.
    runs-on: ubuntu-latest
    outputs:
      adaptation_url: ${{ steps.pr.outputs.adaptation_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create a token to read the downstream artifact
        id: downstream-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.MATHLIB_NIGHTLY_TESTING_APP_ID }}
          private-key: ${{ secrets.MATHLIB_NIGHTLY_TESTING_PRIVATE_KEY }}
          owner: leanprover-community
          repositories: downstream-reports
          permission-actions: read
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: leanprover-community/downstream-reports
          run-id: ${{ needs.check.outputs.downstream_run }}
          github-token: ${{ steps.downstream-token.outputs.token }}
          name: mathlib-adaptation-branch
          path: ${{ runner.temp }}/adaptation
      - name: Confirm the Batteries revision is current
        id: current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          BATTERIES_SHA: ${{ needs.plan.outputs.batteries_sha }}
        with:
          script: |
            const helpers = require('./.github/scripts/mathlib_adaptations.js');
            core.setOutput('current', await helpers.isCurrent({ github, context }));
      - name: Create a token for the adaptation fork
        if: steps.current.outputs.current == 'true'
        id: fork-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.MATHLIB_NIGHTLY_TESTING_APP_ID }}
          private-key: ${{ secrets.MATHLIB_NIGHTLY_TESTING_PRIVATE_KEY }}
          owner: leanprover-community
          repositories: ${{ needs.plan.outputs.adaptation_fork }}
          permission-contents: write
      - name: Push the adaptation branch
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ steps.fork-token.outputs.token }}
          ADAPTATION_FORK: ${{ needs.plan.outputs.adaptation_fork }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          MATHLIB_SHA: ${{ needs.plan.outputs.mathlib_sha }}
        run: |
          git init --bare "$RUNNER_TEMP/publish.git"
          git -C "$RUNNER_TEMP/publish.git" fetch https://github.com/leanprover-community/mathlib4.git "$MATHLIB_SHA"
          git -C "$RUNNER_TEMP/publish.git" fetch "$RUNNER_TEMP/adaptation/mathlib-adaptation.bundle" \
            "refs/heads/adaptations/batteries-$PR_NUMBER:refs/heads/adaptations/batteries-$PR_NUMBER"
          gh auth setup-git
          # A regular push rejects concurrent human edits. Never force-push.
          git -C "$RUNNER_TEMP/publish.git" push "https://github.com/leanprover-community/$ADAPTATION_FORK.git" \
            "refs/heads/adaptations/batteries-$PR_NUMBER"
      - name: Create a token for Mathlib PRs
        if: steps.current.outputs.current == 'true'
        id: mathlib-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.MATHLIB_NIGHTLY_TESTING_APP_ID }}
          private-key: ${{ secrets.MATHLIB_NIGHTLY_TESTING_PRIVATE_KEY }}
          owner: leanprover-community
          repositories: mathlib4
          permission-pull-requests: write
      - name: Open or find the adaptation PR
        if: steps.current.outputs.current == 'true'
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          BATTERIES_SHA: ${{ needs.plan.outputs.batteries_sha }}
          ADAPTATION_FORK: ${{ needs.plan.outputs.adaptation_fork }}
        with:
          github-token: ${{ steps.mathlib-token.outputs.token }}
          script: |
            const helpers = require('./.github/scripts/mathlib_adaptations.js');
            await helpers.openAdaptation({ github, core });

  report:
    needs: [plan, check, publish]
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.check.outputs.build_result == 'success' || needs.publish.outputs.adaptation_url != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          BATTERIES_SHA: ${{ needs.plan.outputs.batteries_sha }}
          DOWNSTREAM_URL: ${{ needs.check.outputs.downstream_url }}
          BUILD_RESULT: ${{ needs.check.outputs.build_result }}
          ADAPTATION_URL: ${{ needs.publish.outputs.adaptation_url }}
        with:
          script: |
            const helpers = require('./.github/scripts/mathlib_adaptations.js');
            await helpers.reportInitial({ github, context });
