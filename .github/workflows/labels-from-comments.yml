# This workflow allows any user to add one of the `awaiting-review`, `awaiting-author`, or `WIP` labels,
# by commenting on the PR or issue.
# Other labels from this set are removed automatically at the same time.

name: Label PR based on Comment

on:
  issue_comment:
    types: [created]

jobs:
  update-label:
    permissions:
      issues: write
      pull-requests: write
    if: github.event.issue.pull_request != null && (github.event.comment.body == 'awaiting-review' || github.event.comment.body == 'awaiting-author' || github.event.comment.body == 'WIP')
    runs-on: ubuntu-latest
    # Serialize runs on the same PR, so that two status comments in quick succession
    # cannot interleave and leave the PR with two status labels.
    concurrency:
      group: update-label-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
    - name: Update status label
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        retries: 3
        script: |
          const { owner, repo, number: issue_number } = context.issue;
          const statusLabels = ['awaiting-review', 'awaiting-author', 'WIP'];

          // Runs are not guaranteed to start in comment order, and a pending run can be
          // replaced by a later one, so apply the newest status command on the PR
          // rather than the comment that triggered this run.
          const comments = await github.paginate(github.rest.issues.listComments,
            { owner, repo, issue_number, per_page: 100 });
          const target = comments.filter(c => statusLabels.includes(c.body)).at(-1)?.body
            ?? context.payload.comment.body;

          // Remove the other status labels. A 404 means the label is not on the PR,
          // which is fine; any other error fails the job.
          for (const name of statusLabels) {
            if (name === target) continue;
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
          }

          await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [target] });

