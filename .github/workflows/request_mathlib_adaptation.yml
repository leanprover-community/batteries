name: Request Mathlib adaptation

on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write

concurrency:
  group: mathlib-adaptation-request-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  request:
    if: github.repository == 'leanprover-community/batteries' && ((github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '!adaptations')) || (github.event_name == 'pull_request_target' && (github.event.action != 'labeled' || github.event.label.name == 'mathlib-adaptations')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const helpers = require('./.github/scripts/mathlib_adaptations.js');
            await helpers.requestAdaptations({ github, context, core });
