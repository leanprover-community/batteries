# This workflow assigns `awaiting-review` or `WIP` labels to new PRs, and it removes
# `awaiting-review`, `awaiting-author`, or `WIP` label from closed PRs.
# It does not modify labels for open PRs that already have one of the `awaiting-review`,
# `awaiting-author`, or `WIP` labels.

name: Label PR from status change

permissions:
  contents: read
  pull-requests: write

on:
  pull_request_target:
    types:
      - closed
      - opened
      - reopened
      - converted_to_draft
      - ready_for_review
    branches:
      - main

jobs:
  auto-label:
    if: github.repository_owner == 'leanprover-community'
    runs-on: ubuntu-latest
    # Shared with `labels-from-comments.yml`; see the comment there.
    concurrency:
      group: pr-status-label-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    steps:

    - name: Update status label
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        retries: 3
        script: |
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const statusLabels = ['awaiting-review', 'awaiting-author', 'WIP'];

          // Act on the current state of the PR rather than the event payload, which
          // may be out of date by the time this run acquires the concurrency group.
          const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
          const present = pr.labels.map(label => label.name).filter(name => statusLabels.includes(name));

          if (pr.state === 'closed') {
            for (const name of present) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
          } else if (present.length === 0) {
            const label = pr.draft ? 'WIP' : 'awaiting-review';
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
          }
